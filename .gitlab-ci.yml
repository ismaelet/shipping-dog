image: docker:29.0.0

services:
  - docker:29.0.0-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_FORCE_HTTPS: "true"

before_script:
  - apk add --no-cache rsync openssh

stages:
  - build
  - deploy
  - import

build:
  stage: build
  script:
    - docker compose -f compose.prod.yml build
  only:
    - development

deploy:
  stage: deploy
  script:
    # Setup SSH agent and add private key
    - eval $(ssh-agent -s)
    - tr -d '\r' < "${DEPLOY_SSH_PRIVATE_KEY}" > /tmp/deploy_key
    - echo >> /tmp/deploy_key
    - chmod 600 /tmp/deploy_key
    - ssh-add /tmp/deploy_key

    # Setup known hosts for SSH
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp ${DEPLOY_SSH_KNOWN_HOSTS} ~/.ssh/known_hosts

    # Authenticate Docker and deploy updated containers
    - docker login -u $CI_REGISTRY_USER  -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker compose -f compose.prod.yml build
    - docker compose -f compose.prod.yml push
    - export DOCKER_HOST="ssh://$DEPLOY_USER@$DEPLOY_SERVER"
    - docker compose -f compose.prod.yml pull app
    - docker compose -f compose.prod.yml up -d --no-deps app
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: on_success
    - when: never
