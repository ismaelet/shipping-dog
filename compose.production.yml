name: shippingdog
services:
  app:
    build:
      context: .
      target: base
    volumes:
      - ./app:/var/www/html
    configs:
      - source: caddy_config
        target: /etc/frankenphp/Caddyfile
      - source: php_config
        target: /usr/local/etc/php/conf.d/app.ini
    ports:
      - 8000:80
    environment:
      APP_NAME: "Shipping Dog"
      APP_FULL_NAME: "Shipping Dog SNC"
      APP_DESCRIPTION: "Capi di abbigliamento personalizzati con stampa di alta qualità, spedizioni internazionali, consegna veloce. Scegli una grafica o caricane una tua. Nuove promozioni ogni settimana."
      APP_SHORT_DESCRIPTION: "T-shirt, Abbigliamento e Accessori Personalizzati"

      APP_LOCALE: it
      APP_FALLBACK_LOCALE: en
      APP_URL: http://localhost:8000
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: REDACTED_LARAVEL_APP_KEY

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: project_database
      DB_USERNAME: root
      DB_PASSWORD: rootpassword

      MAIL_MAILER: smtp
      MAIL_HOST: "smtp.titan.email"
      MAIL_PORT: 465
      MAIL_USERNAME: noreply@shippingdog.com
      MAIL_PASSWORD: REDACTED_SMTP_PASSWORD_COMPOSE
      MAIL_ENCRYPTION: SSL
      MAIL_FROM_ADDRESS: noreply@shippingdog.com
      MAIL_FROM_NAME: "Shipping Dog"

      SENTRY_LARAVEL_DSN: null
      SENTRY_TRACES_SAMPLE_RATE: 0

      GOOGLE_CLIENT_ID: 31403388119-i2vlmbkk8cp8fbhrrbhusdb5g1qb1nbj.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: REMOVED_SECRET
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback

    depends_on:
      db:
        condition: service_healthy

  vite:
    build:
      context: .
      target: base
    volumes:
      - ./app:/var/www/html
      - node_modules:/var/www/html/node_modules
      - pnpm_store:/pnpm/store
    environment:
      PNPM_STORE_DIR: /pnpm/store
    command: /bin/bash -c "pnpm install --frozen-lockfile && pnpm run dev -- --host 0.0.0.0"
    ports:
      - 5173:5173

  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: project_database
      MARIADB_ROOT_PASSWORD: rootpassword
    volumes:
      - db:/var/lib/mysql
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db:
  node_modules:
  pnpm_store:

configs:
  caddy_config:
    content: >-
      {
          frankenphp
          order php_server before file_server
      }

      :80 {
          encode zstd br gzip
          root * /var/www/html/public
          php_server
      }
  php_config:
    content: |
      [PHP]
      upload_max_filesize = 512M
      post_max_size = 512M
