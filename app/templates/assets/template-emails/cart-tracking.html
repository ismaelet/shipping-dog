<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Confirmação do pedido</title>

		<style>
			* {
				margin: 0;
			}

			h1,
			h2,
			h3 {
				margin-bottom: 16px;
				text-align: center;
				font-family: Open Sans;
				font-weight: 400;
			}

			h1 {
				font-size: 36px;
				color: #154a3a;
			}

			h2 {
				font-size: 25px;
			}

			h3 {
				font-size: 18px;
			}

			p {
				font-family: Open Sans;
				font-size: 15px;
				line-height: 1.8;
			}
		</style>
	</head>
	<body style="margin: 0" bgcolor="#d9f4ec">
		<table width="100%" bgcolor="#d9f4ec">
			<tr>
				<td style="padding: 32px">
					<center>
						<table style="width: 100%; max-width: 650px">
							<tr>
								<td>
									<table width="100%" style="padding: 32px 50px; box-shadow: 0 16px 50px rgba(0, 0, 0, 0.1)" bgcolor="#fff">
										<tr>
											<td>
												<center>
													<img src="https://ritualcosmeticos.com.br/app/assets/logo/logo.png" alt="" />
												</center>
											</td>
										</tr>
										<tr>
											<td style="padding-top: 16px">
												<h1>Confirmação de envio</h1>
												<h3 style="padding-bottom: 16px">Pedido n&deg; {{ cartId }}</h3>
											</td>
										</tr>
										<tr>
											<td style="padding-top: 16px; padding-bottom: 20px">
												<p>Obrigado por comprar na ritualcosmeticos.com.br Sua compra foi enviada e já está a caminho.</p>
											</td>
										</tr>
										<tr>
											<td style="padding-bottom: 8px">
												<h3 style="text-align: left">Codico de rastreamento:</h3>
											</td>
										</tr>
										<tr>
											<td style="padding-bottom: 32px">
												<h3 style="padding: 16px; background-color: #ebebeb; border-radius: 5px; margin-bottom: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.1em">
													{{ tracking-code }}
												</h3>
											</td>
										</tr>
										<tr>
											<td style="padding-top: 16px; border-top: 1px solid #ebebeb">
												<center>
													<a href="https://www.linkcorreios.com.br/?id={{ tracking-code }}">
														<p
															style="
																display: inline-block;
																padding: 0 32px;
																background-color: #154a3a;
																border-radius: 32px;
																color: #fff;
																font-size: 18px;
																line-height: 3;
																text-decoration: none;
															"
														>
															Rastrear seu pacote
														</p>
													</a>
												</center>
											</td>
										</tr>
									</table>
								</td>
							</tr>
						</table>
					</center>
				</td>
			</tr>
		</table>
	</body>
</html>
