name: shipping-dog

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: base
    configs:
      - source: caddy_config
        target: /etc/frankenphp/Caddyfile
      - source: php_config
        target: /usr/local/etc/php/conf.d/app.ini
    volumes:
      - ./app:/var/www/html
    working_dir: /var/www/html
    environment:
      APP_NAME: Shipping Dog
      APP_ENV: local
      APP_DEBUG: true
      APP_LOCALE: it
      APP_FALLBACK_LOCALE: en

      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY}

      SESSION_DRIVER: file

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: project_database
      DB_USERNAME: root
      DB_PASSWORD: rootpassword

      MAIL_MAILER: smtp
      MAIL_HOST: smtp.titan.email
      MAIL_PORT: 465
      MAIL_USERNAME: noreply@shippingdog.com
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      MAIL_ENCRYPTION: SSL
      MAIL_FROM_ADDRESS: noreply@shippingdog.com
      MAIL_FROM_NAME: Shipping Dog

      # Services
      SENTRY_LARAVEL_DSN: null
      SENTRY_TRACES_SAMPLE_RATE: 0

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback

      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}

      GLS_CLIENT_ID: ${GLS_CLIENT_ID}
      GLS_CLIENT_PASSWORD: ${GLS_CLIENT_PASSWORD}
      GLS_CONTRACT_CODE: ${GLS_CONTRACT_CODE}
      GLS_HEADQUARTERS: TT
    ports:
      - 8000:80
    depends_on:
      db:
        condition: service_healthy

  vite:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: deps
    volumes:
      - ./app:/var/www/html
      - node_modules:/var/www/html/node_modules
      - pnpm_store:/pnpm/store
    environment:
      PNPM_STORE_DIR: /pnpm/store
    command: /bin/bash -c "pnpm install --frozen-lockfile && pnpm run dev -- --host 0.0.0.0"
    ports:
      - 5173:5173

  db:
    image: mariadb:12.3
    volumes:
      - db:/var/lib/mysql
    environment:
      MARIADB_DATABASE: project_database
      MARIADB_ROOT_PASSWORD: rootpassword
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db:
  node_modules:
  pnpm_store:

configs:
  caddy_config:
    content: >-
      {
          frankenphp
          order php_server before file_server
      }

      :80 {
          encode zstd br gzip
          root * /var/www/html/public
          php_server
      }
  php_config:
    content: |
      [PHP]
      upload_max_filesize = 512M
      post_max_size = 512M
