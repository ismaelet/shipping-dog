name: shippingdog
services:
    app:
        build:
            context: .
            dockerfile: ./docker/app/Dockerfile
        volumes:
            - ./app:/var/www/html
        expose:
            - 9000
        environment:
            APP_NAME: 'Shipping Dog'
            APP_FULL_NAME: 'Shipping Dog SNC'
            APP_DESCRIPTION: 'Capi di abbigliamento personalizzati con stampa di alta qualità, spedizioni internazionali, consegna veloce. Scegli una grafica o caricane una tua. Nuove promozioni ogni settimana.'
            APP_SHORT_DESCRIPTION: 'T-shirt, Abbigliamento e Accessori Personalizzati'

            APP_LOCALE: it
            APP_FALLBACK_LOCALE: it
            APP_URL: http://localhost:8000
            APP_ENV: local
            APP_DEBUG: true
            APP_KEY: REDACTED_LARAVEL_APP_KEY

            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: project_database
            DB_USERNAME: root
            DB_PASSWORD: rootpassword

            MAIL_MAILER: smtp
            MAIL_HOST: 'smtp.titan.email'
            MAIL_PORT: 465
            MAIL_USERNAME: noreply@shippingdog.com
            MAIL_PASSWORD: REDACTED_SMTP_PASSWORD_COMPOSE
            MAIL_ENCRYPTION: SSL
            MAIL_FROM_ADDRESS: noreply@shippingdog.com
            MAIL_FROM_NAME: 'Shipping Dog'

            SENTRY_LARAVEL_DSN: null
            SENTRY_TRACES_SAMPLE_RATE: 0
        depends_on:
            - db

    web:
        image: nginx:alpine
        ports:
            - 8080:80
        volumes:
            - ./app:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    vite:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        volumes:
            - ./app:/var/www/html
        command: /bin/bash -c 'npm install && npm run dev'
        environment:
            VITE_SERVER_HOST: true
            VITE_SERVER_ORIGIN: http://localhost:5173
        ports:
            - 5173:5173
        depends_on:
            - app

    db:
        image: mysql:latest
        environment:
            MYSQL_DATABASE: project_database
            MYSQL_ROOT_PASSWORD: rootpassword
        volumes:
            - db:/var/lib/mysql
        ports:
            - 3306:3306

volumes:
    db:
