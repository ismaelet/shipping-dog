name: ${COMPOSE_PROJECT_NAME:-shipping-dog-staging}
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: run
    configs:
      - source: caddy_config
        target: /etc/frankenphp/Caddyfile
      - source: php_config
        target: /usr/local/etc/php/conf.d/app.ini
    volumes:
      - app_storage:/var/www/html/storage
      - caddy_data:/data
      - caddy_runtime_config:/config
    working_dir: /var/www/html
    environment:
      APP_NAME: Shipping Dog
      APP_ENV: staging
      APP_DEBUG: true
      APP_LOCALE: it
      APP_FALLBACK_LOCALE: en

      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_KEY: ${APP_KEY:?APP_KEY is required}

      SESSION_DRIVER: file

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: shipping-dog
      DB_USERNAME: shipping-dog
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: smtp.titan.email
      MAIL_PORT: 465
      MAIL_USERNAME: noreply@shippingdog.com
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      MAIL_ENCRYPTION: SSL
      MAIL_FROM_ADDRESS: noreply@shippingdog.com
      MAIL_FROM_NAME: Shipping Dog

      # Services
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:?SENTRY_LARAVEL_DSN is required}
      SENTRY_TRACES_SAMPLE_RATE: 0

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_REDIRECT_URI: ${APP_URL:?APP_URL is required}/auth/google/callback

      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:?PAYPAL_CLIENT_ID is required}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:?PAYPAL_CLIENT_SECRET is required}

      GLS_CLIENT_ID: ${GLS_CLIENT_ID:?GLS_CLIENT_ID is required}
      GLS_CLIENT_PASSWORD: ${GLS_CLIENT_PASSWORD:?GLS_CLIENT_PASSWORD is required}
      GLS_CONTRACT_CODE: ${GLS_CONTRACT_CODE:?GLS_CONTRACT_CODE is required}
      GLS_HEADQUARTERS: TT
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:12.3
    environment:
      - "MARIADB_DATABASE=shipping-dog"
      - "MARIADB_USER=shipping-dog"
      - "MARIADB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}"
      - "MARIADB_RANDOM_ROOT_PASSWORD=1"
    volumes:
      - db:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_storage:
  caddy_data:
  caddy_runtime_config:
  db:

configs:
  caddy_config:
    content: >-
      {
          frankenphp
          order php_server before file_server
      }

      {$$APP_DOMAIN} {
          handle {
              encode zstd br gzip
              root * /var/www/html/public
              php_server
          }
      }

  php_config:
    content: |
      [PHP]
      upload_max_filesize = 512M
      post_max_size = 512M
      memory_limit = 512M
