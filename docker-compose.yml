services:
    laravel:
        container_name: ${APP_SLUG}-laravel
        build:
            context: .
            dockerfile: ./Dockerfile
        volumes:
            - '.:/var/www/html'
        ports:
            - '8000:8000'
        depends_on:
            - ${DB_HOST}
        command: php artisan serve --host=0.0.0.0 --port=8000
    database:
        container_name: ${DB_HOST}
        image: 'mysql:latest'
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'mysql:/var/lib/mysql'
    vite:
        image: node:latest
        container_name: vite
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        command: /bin/bash -c 'npm install && npm run dev'
        environment:
            VITE_SERVER_HOST: true
            VITE_SERVER_ORIGIN: http://localhost:5173
        ports:
            - '5173:5173'
volumes:
    mysql:
        driver: local
