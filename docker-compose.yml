services:
    laravel:
        container_name: ${APP_SLUG}-laravel
        build:
            context: .
            dockerfile: ./Dockerfile
        volumes:
            - '.:/var/www/html'
        ports:
            - '8000:8000'
        depends_on:
            - ${DB_HOST}
        command: php artisan serve --host=0.0.0.0 --port=8000
        networks:
            - internal
    database:
        container_name: ${DB_HOST}
        image: 'mysql:latest'
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'mysql:/var/lib/mysql'
        networks:
            - internal
    vite:
        image: node:latest
        container_name: vite
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        command: bash -c "npm install && npm run build"
        ports:
            - '5173:5173'
        networks:
            - internal
networks:
    internal:
        driver: bridge
volumes:
    mysql:
        driver: local
