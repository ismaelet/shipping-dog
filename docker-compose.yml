services:
    laravel:
        container_name: ${APP_SLUG}-laravel
        build:
            context: .
            dockerfile: ./Dockerfile
        volumes:
            - '.:/var/www/html'
        ports:
            - '80:80'
        depends_on:
            - ${DB_HOST}
        command: php artisan serve --host=0.0.0.0 --port=80
        networks:
            - internal
    database:
        container_name: ${DB_HOST}
        image: 'mysql:latest'
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'mysql:/var/lib/mysql'
        networks:
            - internal
    phpmyadmin:
        container_name: phpmyadmin
        image: phpmyadmin
        ports:
            - 8080:80
        environment:
            PMA_HOST: ${DB_HOST}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            UPLOAD_LIMIT: 100000000
        networks:
            - internal
        depends_on:
            - ${DB_HOST}
networks:
    internal:
        driver: bridge
volumes:
    mysql:
        driver: local
